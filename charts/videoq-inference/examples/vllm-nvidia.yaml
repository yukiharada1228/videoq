# Two allocatable NVIDIA GPUs: one per model; Whisper stays on CPU.
# Requires NVIDIA drivers, device plugin, and site hardware acceptance.
backend: vllm
servers:
  chat:
    modelRepo: Qwen/Qwen3-4B
    modelRevision: 1cfa9a7208912126459214e8b04321603b3df60c
    modelFile: ""
    modelSha256: ""
    persistence: { size: 20Gi }
    nodeSelector: { kubernetes.io/arch: amd64 }
    extraArgs: [--gpu-memory-utilization, "0.85"]
    resources:
      requests: { cpu: "2", memory: 8Gi, nvidia.com/gpu: 1 }
      limits: { cpu: "8", memory: 16Gi, nvidia.com/gpu: 1 }
  embedding:
    servedModel: qwen3-embedding-4b-5cf2132a
    modelRepo: Qwen/Qwen3-Embedding-4B
    modelRevision: 5cf2132abc99cad020ac570b19d031efec650f2b
    modelFile: ""
    modelSha256: ""
    persistence: { size: 20Gi }
    nodeSelector: { kubernetes.io/arch: amd64 }
    # Qwen3 Embedding supports Matryoshka; explicitly permit VideoQ's 1536 dimensions.
    extraArgs: [--gpu-memory-utilization, "0.85", --convert, embed, --hf-overrides, '{"matryoshka_dimensions":[1536]}']
    resources:
      requests: { cpu: "2", memory: 8Gi, nvidia.com/gpu: 1 }
      limits: { cpu: "4", memory: 16Gi, nvidia.com/gpu: 1 }
