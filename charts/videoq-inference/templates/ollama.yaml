{{- if eq .Values.backend "ollama" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inference.fullname" . }}-ollama
  labels:
    {{- include "inference.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: ollama }
  template:
    metadata:
      labels:
        {{- include "inference.labels" . | nindent 8 }}
        app.kubernetes.io/component: ollama
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      {{- with .Values.ollama.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ollama.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.downloadModels }}
      initContainers:
        - name: provision-models
          image: {{ include "inference.image" (dict "root" . "image" .Values.ollama.image "component" "ollama") | quote }}
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          command: [/bin/sh, -ec]
          args:
            - |
              ollama serve >/tmp/ollama-provision.log 2>&1 &
              server_pid=$!
              trap 'kill "$server_pid" 2>/dev/null || true' EXIT
              count=0
              until ollama list >/dev/null 2>&1; do
                count=$((count + 1)); [ "$count" -lt 60 ] || exit 1; sleep 1
              done
              ollama show "$CHAT_MODEL" >/dev/null 2>&1 || ollama pull "$CHAT_MODEL"
              ollama show "$EMBEDDING_MODEL" >/dev/null 2>&1 || ollama pull "$EMBEDDING_MODEL"
          env:
            - { name: OLLAMA_HOST, value: "127.0.0.1:11434" }
            - { name: OLLAMA_MODELS, value: /models }
            - { name: HOME, value: /tmp }
            - { name: OLLAMA_NO_CLOUD, value: "1" }
            - { name: CHAT_MODEL, value: {{ .Values.ollama.chatModel | quote }} }
            - { name: EMBEDDING_MODEL, value: {{ .Values.ollama.embeddingModel | quote }} }
          securityContext: {{ include "inference.security" . | nindent 12 }}
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 512Mi } }
          volumeMounts: [{ name: models, mountPath: /models }]
      {{- end }}
      containers:
        - name: ollama
          image: {{ include "inference.image" (dict "root" . "image" .Values.ollama.image "component" "ollama") | quote }}
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          args: [serve]
          ports: [{ name: http, containerPort: 11434 }]
          env:
            - { name: OLLAMA_HOST, value: "0.0.0.0:11434" }
            - { name: OLLAMA_MODELS, value: /models }
            - { name: HOME, value: /tmp }
            - { name: OLLAMA_NO_CLOUD, value: "1" }
            - { name: OLLAMA_MAX_LOADED_MODELS, value: "1" }
            - { name: OLLAMA_NUM_PARALLEL, value: "1" }
            - { name: OLLAMA_CONTEXT_LENGTH, value: {{ .Values.ollama.contextLength | quote }} }
            - { name: OLLAMA_KEEP_ALIVE, value: {{ .Values.ollama.keepAlive | quote }} }
            - { name: CHAT_MODEL, value: {{ .Values.ollama.chatModel | quote }} }
            - { name: EMBEDDING_MODEL, value: {{ .Values.ollama.embeddingModel | quote }} }
          startupProbe: { httpGet: { path: /api/tags, port: http }, periodSeconds: 5, failureThreshold: 120 }
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - 'OLLAMA_HOST=127.0.0.1:11434 ollama show "$CHAT_MODEL" >/dev/null && OLLAMA_HOST=127.0.0.1:11434 ollama show "$EMBEDDING_MODEL" >/dev/null'
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe: { httpGet: { path: /api/tags, port: http }, periodSeconds: 30 }
          securityContext: {{ include "inference.security" . | nindent 12 }}
          resources: {{ toYaml .Values.ollama.resources | nindent 12 }}
          volumeMounts: [{ name: models, mountPath: /models }]
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-ollama" (include "inference.fullname" .)) .Values.ollama.persistence.existingClaim }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "inference.fullname" . }}-ollama
  labels:
    {{- include "inference.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: ollama }
  ports: [{ name: http, port: 11434, targetPort: http }]

{{- end }}
