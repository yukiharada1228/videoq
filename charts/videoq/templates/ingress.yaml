{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "videoq.fullname" . }}
  labels:
    {{- include "videoq.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ (urlParse .Values.publicUrl).hostname | quote }}
      http:
        paths:
          {{- range $route, $service := dict "/api" "api" "/.well-known" "api" "/health" "api" "/ready" "api" "/" "web" }}
          - path: {{ $route }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "videoq.fullname" $ }}-{{ $service }}
                port:
                  number: {{ if eq $service "api" }}8787{{ else }}80{{ end }}
          {{- end }}
{{- end }}
