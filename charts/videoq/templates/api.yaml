apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "videoq.fullname" . }}-api
  labels:
    {{- include "videoq.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "videoq.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "videoq.selector" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 65
      securityContext:
        {{- include "videoq.nodeSecurity" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "videoq.apiImage" . | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- include "videoq.containerSecurity" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8787 }
          envFrom:
            {{- include "videoq.envFrom" . | nindent 12 }}
          {{- with .Values.api.extraEnv }}
          env: {{ toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "videoq.fullname" . }}-api
  labels:
    {{- include "videoq.labels" . | nindent 4 }}
spec:
  ports:
    - { name: http, port: 8787, targetPort: http }
  selector:
    {{- include "videoq.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
