# Layer over site.yaml after deploying and validating your inference services.
# Set a nonempty OPENAI_API_KEY in the existing Secret, including a local dummy
# value when the OpenAI-compatible chat endpoint does not require authentication.
ai:
  openaiBaseUrl: http://llm.inference.svc.cluster.local:8000/v1
  llmModel: your-vision-tool-calling-model
  embeddingProvider: ollama
  embeddingModel: qwen3-embedding:4b
  ollamaBaseUrl: http://ollama.inference.svc.cluster.local:11434
  whisperBackend: local
  whisperLocalUrl: http://whisper.inference.svc.cluster.local:8080/v1
