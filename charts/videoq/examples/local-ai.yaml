# Layer over site.yaml after installing charts/videoq-inference in namespace videoq.
# Set a nonempty OPENAI_API_KEY in the existing Secret, including a local dummy
# value when the OpenAI-compatible chat endpoint does not require authentication.
ai:
  openaiBaseUrl: http://videoq-inference-ollama.videoq.svc.cluster.local:11434/v1
  llmModel: qwen3:4b
  reasoningEffort: none
  separateToolSchema: true
  # CPU agent/tool rounds can take several minutes. Match ingress timeouts.
  requestTimeoutMs: 600000
  streamTimeoutMs: 600000
  embeddingProvider: ollama
  embeddingModel: qwen3-embedding:4b
  ollamaBaseUrl: http://videoq-inference-ollama.videoq.svc.cluster.local:11434
  whisperBackend: local
  whisperLocalUrl: http://videoq-inference-whisper.videoq.svc.cluster.local:8080/v1

# This CPU model has no image input. Transcript Q&A and timestamp citations work.
# Use a validated local vision model before enabling visual inspection.
config:
  videoVisualEnabled: false

networkPolicy:
  localEgressOnly: true
