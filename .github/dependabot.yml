version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns: ["*"]

  # The root lockfile covers every npm workspace in apps/ and packages/.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      # Keep packages with shared versions / peer requirements together,
      # including major upgrades. Other major upgrades get individual PRs.
      better-auth:
        patterns: ["better-auth", "@better-auth/*"]
      trpc:
        patterns: ["@trpc/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      storybook:
        patterns: ["storybook", "@storybook/*"]
      docusaurus:
        patterns: ["@docusaurus/*"]
      remotion:
        patterns: ["remotion", "@remotion/*"]
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # Use uv so that pyproject.toml and the checked-in uv.lock stay in sync.
  - package-ecosystem: uv
    directory: /apps/worker
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
      - /apps/worker
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      compose-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directories:
      - /infra
      - /infra/bootstrap
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      terraform-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Track the optional whisper.cpp checkout, not its vendored dependencies.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
