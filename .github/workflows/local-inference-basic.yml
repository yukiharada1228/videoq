name: Local Inference Basic Checks
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'
permissions:
  contents: read
concurrency:
  group: inference-basic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  basic:
    name: Basic inference / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, architecture: amd64 }
          - { runner: ubuntu-24.04-arm, architecture: arm64 }
          - { runner: macos-15, architecture: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - run: npm ci --ignore-scripts --workspace @videoq/api
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install checksum-pinned Helm and uv
        run: |
          HELM_INSTALL_DIR="$RUNNER_TEMP/basic-helm" bash .github/scripts/install-helm.sh
          bash .github/scripts/install-uv.sh
      - name: Validate chart variants and application protocol adapters
        env:
          HELM_BIN: ${{ runner.temp }}/basic-helm/helm
        working-directory: apps/api
        run: npm run test:unit -- test/helm-chart.test.ts test/inference-chart.test.ts test/local-chat-model.test.ts
      - name: Validate worker speech, embedding and configuration contracts
        working-directory: apps/worker
        run: |
          uv sync --locked --extra dev
          uv run --locked --extra dev pytest -q tests/test_transcription_whisper.py tests/test_embeddings.py tests/test_secrets_bootstrap.py --junitxml="$RUNNER_TEMP/basic-worker.xml"
      - name: Install upstream Homebrew bottles
        if: runner.os == 'macOS'
        run: brew install --force-bottle llama.cpp whisper.cpp ffmpeg
      - name: Check native upstream server packages
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import {parse} from "yaml"; fs.writeFileSync(process.env.RUNNER_TEMP+"/inference-values.json",JSON.stringify(parse(fs.readFileSync("charts/videoq-inference/values.yaml","utf8"))))'
          python3 .github/scripts/onprem-basic-packages.py "$RUNNER_TEMP/inference-values.json" "$RUNNER_TEMP/basic-packages" --architecture "$ARCHITECTURE"
      - name: Retain basic verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-inference-basic-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/basic-packages/
            ${{ runner.temp }}/basic-worker.xml
          retention-days: 7
          if-no-files-found: warn
