name: Dependency CI Queue
on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed, ready_for_review, labeled, unlabeled, edited, converted_to_draft]
  push:
    branches: [main]
  workflow_run:
    workflows: [CI, Container Validation, Terraform Plan, Dependency Auto-merge, Runtime Auto-merge, Runtime Updates]
    types: [completed, requested]
  workflow_dispatch:
    inputs:
      retry:
        description: PR number to retry after investigating a failure (optional)
        type: string
permissions:
  contents: read
concurrency:
  group: dependency-ci-queue
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      github.repository == 'yukiharada1228/videoq' &&
      vars.DEPENDENCY_QUEUE_ENABLED == 'true' && vars.DEPENDENCY_AUTOMERGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      checks: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ vars.PATCH_BOT_APP_ID }}
          private-key: ${{ secrets.PATCH_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-administration: read
          permission-workflows: write
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          QUEUE_ISSUE: ${{ vars.DEPENDENCY_QUEUE_ISSUE }}
          RETRY: ${{ inputs.retry }}
          RUNTIME_AUTOMERGE_ENABLED: ${{ vars.RUNTIME_AUTOMERGE_ENABLED }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
        with:
          script: |
            // pull_request_target has a base-branch ref; force the trusted-main
            // guard and read current main independently of the event snapshot.
            const trusted = { ...context, ref: 'refs/heads/main' };
            await require('./.github/scripts/dependency-queue.cjs').reconcile({
              github, writerGithub: new github.constructor({ auth: process.env.APP_TOKEN }), context: trusted,
              issue: Number(process.env.QUEUE_ISSUE), retry: Number(process.env.RETRY || 0),
              saveSummary: text => core.summary.addRaw(text).write(),
            });
