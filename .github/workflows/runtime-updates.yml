name: Runtime Updates
on:
  schedule:
    - cron: '13 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Discover updates without creating or changing PRs
        type: boolean
        default: true
      runtime:
        description: Runtime to check
        type: choice
        options: [all, node, python, npm, pip, uv]
        default: all
      channel:
        description: Release line to check
        type: choice
        options: [current, next, both]
        default: current
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: runtime-updates-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'discovery' }}
  cancel-in-progress: false
jobs:
  scope:
    if: github.repository == 'videoq-jp/videoq' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUNTIME: ${{ inputs.runtime || 'all' }}
          CHANNEL: ${{ inputs.channel || 'current' }}
        with:
          script: |
            const result = await require('./.github/scripts/runtime-pull-request.cjs').scope({
              github, context, runtime: process.env.RUNTIME, channel: process.env.CHANNEL,
            });
            core.setOutput('matrix', JSON.stringify(result.matrix));
            await core.summary.addRaw('Checking selected runtime proposals.').write();
  propose:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: runtime-proposal-${{ matrix.runtime }}-${{ matrix.channel }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: pip
      - name: Discover official interpreter releases and immutable images
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNTIME: ${{ matrix.runtime }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          args=()
          if [ "$CHANNEL" = next ]; then args+=(--upgrade); fi
          python .github/scripts/runtime-versions.py plan --runtime "$RUNTIME" "${args[@]}" --output runtime-plan.json
      - name: Describe the proposed update
        run: |
          python - <<'PY'
          import json, os
          plan = json.load(open('runtime-plan.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f"{plan['runtime']} ({plan['channel']}): {plan['version']} — {len(plan['files'])} changed files\n")
          PY
      - name: Create repository-scoped runtime update token
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PATCH_BOT_APP_ID }}
          private-key: ${{ secrets.PATCH_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Publish coordinated runtime update proposals
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUNTIME_BOT: ${{ steps.app.outputs.app-slug }}[bot]
          RETIRE_SUPERSEDED: ${{ vars.DEPENDENCY_AUTOMERGE_ENABLED == 'true' && vars.RUNTIME_AUTOMERGE_ENABLED != 'false' }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const fs = require('node:fs');
            const { publish } = require('./.github/scripts/runtime-pull-request.cjs');
            await publish({ github, context, core, bot: process.env.RUNTIME_BOT,
              plan: JSON.parse(fs.readFileSync('runtime-plan.json', 'utf8')),
              retireSuperseded: process.env.RETIRE_SUPERSEDED === 'true',
            });
