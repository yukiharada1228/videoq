name: Audit Hosted AI Credentials
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-ai-credential-maintenance
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'videoq-jp/videoq' && github.ref == 'refs/heads/main'
    environment: production-infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: infra/scripts
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install AWS SDK before credentials
        run: python -m pip install --disable-pip-version-check 'boto3==1.43.122'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_DEPLOY_ROLE_ARN }}
          role-session-name: videoq-ai-credential-audit
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Inventory names and presence without exposing credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
        run: python infra/scripts/audit_ai_credentials.py
