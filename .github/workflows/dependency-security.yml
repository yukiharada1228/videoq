name: Dependency Security Audit
on:
  schedule:
    - cron: '19 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-security
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'videoq-jp/videoq' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: pip
      - name: Audit the complete locked dependency graph
        run: python .github/scripts/dependency-security.py
      - name: Publish or resolve the managed issue
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const { notify } = require('./.github/scripts/operations-notify.cjs');
            let report = { status: 'error', summary: '依存関係の定期検査を完了できませんでした。', details: [] };
            if (fs.existsSync('operations-report.json')) report = JSON.parse(fs.readFileSync('operations-report.json', 'utf8'));
            await notify({ github, context, core, kind: 'dependency-security', title: '依存関係の脆弱性', report });
            if (report.status !== 'ok') core.setFailed(report.summary);
