name: Terraform Apply

# Trigger directly on push to main with a path filter rather than chaining
# off the CI workflow_run. workflow_run + dorny/paths-filter silently
# skips deploys on merge commits because the workflow_run payload has no
# `before` SHA, so paths-filter falls back to `git log -n 1 HEAD` which
# returns no files for a merge commit. The native push `paths:` filter
# evaluates the actual push diff and handles merge commits correctly.
on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-apply.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Terraform Apply (production)
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Terraform apply
        env:
          TF_VAR_pages_domain: ${{ secrets.PAGES_DOMAIN }}
          TF_VAR_custom_domain: ${{ secrets.CUSTOM_DOMAIN }}
          TF_VAR_certificate_arn: ${{ secrets.CERTIFICATE_ARN }}
          # Used to manage OpenAI projects with the openai/openai provider.
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
          TF_VAR_openai_spend_alert_email: ${{ secrets.OPENAI_SPEND_ALERT_EMAIL }}
        run: terraform apply -auto-approve -input=false
