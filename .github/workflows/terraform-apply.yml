name: Terraform Apply

# Trigger directly on push to main with a path filter rather than chaining
# off the CI workflow_run. workflow_run + dorny/paths-filter silently
# skips deploys on merge commits because the workflow_run payload has no
# `before` SHA, so paths-filter falls back to `git log -n 1 HEAD` which
# returns no files for a merge commit. The native push `paths:` filter
# evaluates the actual push diff and handles merge commits correctly.
on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '!infra/**/*.md'
      - '.github/workflows/terraform-apply.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  scope:
    name: Classify infrastructure update
    if: github.repository == 'yukiharada1228/videoq' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      current: ${{ steps.scope.outputs.current }}
      automatic: ${{ steps.scope.outputs.automatic }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: scope
        env:
          AUTO_APPLY_ENABLED: ${{ vars.TERRAFORM_DEPENDENCY_AUTOAPPLY_ENABLED }}
        with:
          script: |
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            const current = branch.commit.sha === context.sha;
            const { automaticTerraformApply } = require('./.github/scripts/terraform-dependency-apply.cjs');
            const automatic = current && process.env.AUTO_APPLY_ENABLED === 'true' &&
              await automaticTerraformApply({ github, context });
            core.setOutput('current', current);
            core.setOutput('automatic', automatic);
            await core.summary.addRaw(!current ? 'Superseded main revision; no apply.' : automatic
              ? 'Verified Dependabot Terraform minor/patch update: apply automatically only when the plan detects changes.'
              : 'Request production-infra approval only when the plan detects changes.').write();

  terraform-apply:
    name: Terraform Apply (production)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [scope, preflight]
    permissions:
      contents: read
      id-token: write
    if: >-
      needs.scope.outputs.current == 'true' &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.has_changes == 'true' &&
      needs.scope.outputs.automatic != 'true'
    environment: production-infra
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify this revision is still main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            if (data.commit.sha !== context.sha) throw new Error('Main advanced; refusing a stale infrastructure apply.');

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_DEPLOY_ROLE_ARN }}
          role-session-name: videoq-terraform-apply
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Terraform apply
        env:
          # Used to manage OpenAI projects with the openai/openai provider.
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
          TF_VAR_openai_spend_alert_email: ${{ secrets.OPENAI_SPEND_ALERT_EMAIL }}
          TF_VAR_operations_alert_email: ${{ secrets.OPERATIONS_ALERT_EMAIL }}
        run: terraform apply -auto-approve -input=false

  terraform-dependency-apply:
    name: Terraform Apply (verified dependency update)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [scope, preflight]
    permissions:
      contents: read
      id-token: write
    if: >-
      needs.scope.outputs.current == 'true' &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.has_changes == 'true' &&
      needs.scope.outputs.automatic == 'true'
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify this revision is still main
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            if (data.commit.sha !== context.sha) throw new Error('Main advanced; refusing a stale infrastructure apply.');

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_DEPLOY_ROLE_ARN }}
          role-session-name: videoq-terraform-apply
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -lockfile=readonly -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Terraform apply
        env:
          # Used to manage OpenAI projects with the openai/openai provider.
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
          TF_VAR_openai_spend_alert_email: ${{ secrets.OPENAI_SPEND_ALERT_EMAIL }}
          TF_VAR_operations_alert_email: ${{ secrets.OPERATIONS_ALERT_EMAIL }}
        run: terraform apply -auto-approve -input=false

  preflight:
    name: Check Terraform changes before approval
    needs: scope
    if: needs.scope.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_PLAN_ROLE_ARN }}
          role-session-name: videoq-terraform-preflight
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Initialize with the reviewed lockfile
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: terraform init -lockfile=readonly -input=false -backend-config="bucket=$TF_STATE_BUCKET" > /dev/null 2>&1
      - name: Plan without publishing state or attribute values
        id: plan
        env:
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
          TF_VAR_openai_spend_alert_email: ${{ secrets.OPENAI_SPEND_ALERT_EMAIL }}
          TF_VAR_operations_alert_email: ${{ secrets.OPERATIONS_ALERT_EMAIL }}
        run: python scripts/terraform_preflight.py
