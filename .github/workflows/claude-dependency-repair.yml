name: Claude Dependency Repair
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Current Dependabot CI run ID
        required: false
        type: string
      authentication_test:
        description: Only test Claude subscription authentication (no PR changes)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: claude-dependency-run-${{ github.event.workflow_run.head_branch || inputs.run_id }}
  cancel-in-progress: false
jobs:
  authentication-test:
    if: >-
      github.repository == 'yukiharada1228/videoq' &&
      github.event_name == 'workflow_dispatch' && inputs.authentication_test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # Empty --tools values are dropped by the Action's SDK argument parser.
          # Offer only Read, then deny it, so no built-in tools remain.
          claude_args: '--tools Read --disallowedTools Read --max-turns 1'
          # This fixed prompt has no repository tools or write access. Surface
          # provider errors here so expired tokens and usage limits are actionable.
          show_full_output: true
          prompt: 'Authentication test only. Reply exactly: Claude subscription authentication succeeded. Do not use tools or change any files.'
  inspect:
    if: >-
      github.repository == 'yukiharada1228/videoq' && github.ref == 'refs/heads/main' &&
      vars.CLAUDE_DEPENDENCY_REPAIR_ENABLED == 'true' && !inputs.authentication_test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      number: ${{ steps.inspect.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: inspect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        with:
          script: |
            const c = await require('./.github/scripts/claude-dependency-repair.cjs').candidate({ github, context, runId: process.env.CI_RUN_ID });
            if (c) core.setOutput('number', c.pr.number);
            else await core.summary.addRaw('No eligible current dependency update.').write();
  decide:
    needs: inspect
    if: needs.inspect.outputs.number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dependency-automation-${{ needs.inspect.outputs.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: write
    outputs:
      number: ${{ steps.decide.outputs.number }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ vars.PATCH_BOT_APP_ID }}
          private-key: ${{ secrets.PATCH_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-administration: read
      - id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MERGE_ENABLED: ${{ vars.DEPENDENCY_AUTOMERGE_ENABLED }}
        with:
          script: |
            const policy = require('./.github/scripts/claude-dependency-repair.cjs');
            const args = { github, context, runId: process.env.CI_RUN_ID };
            const app = new github.constructor({ auth: process.env.APP_TOKEN });
            if (process.env.MERGE_ENABLED === 'true') {
              const ready = await policy.merge({ ...args, writerGithub: app });
              if (ready) {
                await exec.exec('gh', ['pr', 'merge', String(ready.number), '--auto', '--squash', '--match-head-commit', ready.sha], {
                  env: { ...process.env, GH_TOKEN: process.env.APP_TOKEN, GH_REPO: context.payload.repository.full_name },
                });
                return;
              }
            }
            if (!process.env.CLAUDE_TOKEN) throw new Error('Register CLAUDE_CODE_OAUTH_TOKEN before enabling repair.');
            const repair = await policy.scope(args);
            if (repair) for (const key of ['number', 'sha']) core.setOutput(key, repair[key]);
  dispatch:
    needs: decide
    if: needs.decide.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: write
    steps:
      - name: Dispatch the independently authorized repair workflow
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.decide.outputs.number }}
          EXPECTED_SHA: ${{ needs.decide.outputs.sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({ ...context.repo,
              workflow_id: 'claude-dependency-worker.yml', ref: 'main', inputs: {
                number: process.env.PR_NUMBER, sha: process.env.EXPECTED_SHA,
                run_id: process.env.CI_RUN_ID, authorization_run: String(context.runId),
              },
            });
      - name: Notify if the repair could not be dispatched
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.decide.outputs.number }}
        with:
          script: |
            await github.rest.issues.createComment({ ...context.repo, issue_number: Number(process.env.PR_NUMBER),
              body: `Claude修正ジョブを起動できませんでした。確認が必要です: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
