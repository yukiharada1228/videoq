name: Codex Dependency Repair Request

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Failed Dependabot CI run ID to prepare a Codex request for
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: codex-repair-request-${{ github.event.workflow_run.head_branch || inputs.run_id }}
  cancel-in-progress: false

jobs:
  scope:
    if: >-
      github.repository == 'yukiharada1228/videoq' && github.ref == 'refs/heads/main' &&
      vars.CODEX_REPAIR_REQUESTS_ENABLED != 'false' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      number: ${{ steps.scope.outputs.number }}
    steps:
      # Trusted notification logic only: do not check out or execute PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Identify the current failed dependency PR
        id: scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FAILED_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        with:
          script: |
            const { repairCandidate } = require('./.github/scripts/dependency-automation.cjs');
            const candidate = await repairCandidate({ github, context, runId: process.env.FAILED_RUN_ID });
            if (candidate) core.setOutput('number', candidate.number);
            else await core.summary.addRaw('No eligible current Dependabot failure.').write();

  request:
    needs: scope
    if: needs.scope.outputs.number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Serialize the final mutations with this PR's auto-merge workflow.
    concurrency:
      group: dependency-automation-${{ needs.scope.outputs.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Prepare a subscription-based Codex repair request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FAILED_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        with:
          script: |
            const { requestRepair } = require('./.github/scripts/dependency-automation.cjs');
            const candidate = await requestRepair({ github, context, runId: process.env.FAILED_RUN_ID });
            await core.summary.addRaw(candidate
              ? `Prepared the repair request on PR #${candidate.number}. The owner can ask Codex through the GitHub integration; no model or API key was used by this workflow.`
              : 'No eligible current Dependabot failure; no repair request was posted.'
            ).write();
