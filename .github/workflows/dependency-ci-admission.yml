# Shared read-only admission policy for PR validation workflows.
name: Dependency CI Admission
on:
  workflow_call:
    outputs:
      run:
        description: Whether this PR may execute its selected CI jobs
        value: ${{ jobs.admission.outputs.run }}
permissions:
  contents: read
  issues: read
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      run: ${{ steps.admission.outputs.run }}
    steps:
      # Read trusted main policy; this job never installs or executes PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: admission
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          QUEUE_ENABLED: ${{ vars.DEPENDENCY_QUEUE_ENABLED }}
          QUEUE_ISSUE: ${{ vars.DEPENDENCY_QUEUE_ISSUE }}
        with:
          script: |
            if (process.env.QUEUE_ENABLED !== 'true') { core.setOutput('run', true); return; }
            const run = await require('./.github/scripts/dependency-queue.cjs').admission({
              github, context, issue: Number(process.env.QUEUE_ISSUE), enabled: true,
            });
            core.setOutput('run', run);
            await core.summary.addRaw(run ? 'CI admitted.' : 'Waiting for the dependency queue. Heavy jobs are deferred.').write();
      - name: Queue slot admitted
        if: steps.admission.outputs.run == 'true'
        run: echo 'Normal CI is authorized for this PR and main snapshot.'

