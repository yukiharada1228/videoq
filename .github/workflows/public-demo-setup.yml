name: Prepare Production Public Demo
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Audit, or provision the dedicated five-lesson demo with 100 answers/month
        type: choice
        options: [audit, provision]
        default: audit
permissions:
  contents: read
concurrency:
  group: production-public-demo-setup
  cancel-in-progress: false
jobs:
  setup:
    if: github.repository == 'videoq-jp/videoq' && github.ref == 'refs/heads/main'
    environment: production-app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-operations-tools
      - name: Audit or prepare only the dedicated public demo
        env:
          OPERATION: ${{ inputs.operation }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node .github/scripts/provision-public-demo.mjs
