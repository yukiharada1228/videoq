name: Terraform Plan

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      # Dependabot and fork PRs must validate without production state or secrets.
      - name: Terraform init (without backend)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform tests (mock providers)
        run: terraform test -no-color

  terraform-plan:
    name: Terraform Plan (AWS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: terraform-validate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_PLAN_ROLE_ARN }}
          role-session-name: videoq-terraform-plan
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Terraform plan
        id: plan
        env:
          # Used to manage OpenAI projects with the openai/openai provider.
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
          TF_VAR_openai_spend_alert_email: ${{ secrets.OPENAI_SPEND_ALERT_EMAIL }}
          TF_VAR_operations_alert_email: ${{ secrets.OPERATIONS_ALERT_EMAIL }}
        run: |
          set +e
          PLAN_OUTPUT=$(terraform plan -no-color -input=false 2>&1)
          TF_EXIT_CODE=$?
          set -e
          {
            echo "plan_output<<PLAN_EOF"
            echo "$PLAN_OUTPUT"
            echo "PLAN_EOF"
            echo "exit_code=$TF_EXIT_CODE"
          } >> "$GITHUB_OUTPUT"

      - name: Find existing comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- terraform-plan -->'

      - name: Post terraform plan comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- terraform-plan -->
            ## Terraform Plan

            Changes were detected in `infra/**`. Review the diff below before merging.

            <details>
            <summary>Terraform plan result (click to expand)</summary>

            ```
            ${{ steps.plan.outputs.plan_output }}
            ```

            </details>

            > After merging into `main`, `terraform apply` runs automatically following manual approval.

      - name: Fail if plan errored
        if: steps.plan.outputs.exit_code != '0'
        run: |
          echo "Terraform plan failed (exit ${{ steps.plan.outputs.exit_code }}). Review the comment above."
          exit 1

  terraform-result:
    # Preserve the existing check name and fail it when validation fails,
    # even when the AWS job is skipped for a Dependabot or fork PR.
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [terraform-validate, terraform-plan]
    steps:
      - name: Require Terraform checks to pass
        env:
          VALIDATE_RESULT: ${{ needs.terraform-validate.result }}
          PLAN_RESULT: ${{ needs.terraform-plan.result }}
        run: |
          test "$VALIDATE_RESULT" = success
          case "$PLAN_RESULT" in
            success) echo 'Terraform validation and AWS plan passed.' >> "$GITHUB_STEP_SUMMARY" ;;
            skipped) echo 'Terraform validation and mock tests passed. AWS plan is skipped for Dependabot and fork PRs because production secrets are unavailable.' >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::Terraform plan did not pass ($PLAN_RESULT)"; exit 1 ;;
          esac
