name: Retire Direct AI Credentials
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Review metadata and IAM permissions, or retire reviewed direct keys
        type: choice
        options: [plan, retire]
        default: plan
      key_ids:
        description: Exact reviewed OpenAI key IDs as a JSON array (retire only)
        type: string
        default: '[]'
      expected_ssm_version:
        description: App parameter version from the reviewed plan (retire only)
        type: string
permissions:
  contents: read
concurrency:
  group: hosted-ai-credential-maintenance
  cancel-in-progress: false
jobs:
  maintenance:
    if: github.repository == 'videoq-jp/videoq' && github.ref == 'refs/heads/main'
    environment: production-infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: infra/scripts
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install AWS SDK before credentials
        run: python -m pip install --disable-pip-version-check 'boto3==1.43.122'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_DEPLOY_ROLE_ARN }}
          role-session-name: videoq-ai-credential-retirement
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Plan or retire the reviewed direct AI keys
        env:
          OPERATION: ${{ inputs.operation }}
          KEY_IDS: ${{ inputs.key_ids }}
          EXPECTED_SSM_VERSION: ${{ inputs.expected_ssm_version }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
        run: |
          python infra/scripts/retire_ai_credentials.py
          if [ "$OPERATION" = plan ]; then
            python infra/scripts/audit_legacy_ai_key.py
          fi

  iam-audit:
    if: github.repository == 'videoq-jp/videoq' && github.ref == 'refs/heads/main' && inputs.operation == 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: infra/scripts
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install AWS SDK before credentials
        run: python -m pip install --disable-pip-version-check 'boto3==1.43.122'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_PLAN_ROLE_ARN }}
          role-session-name: videoq-api-iam-read-audit
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Read API IAM policies and key ages
        run: python infra/scripts/audit_api_iam.py
