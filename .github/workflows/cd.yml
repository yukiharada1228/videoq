name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      api: ${{ steps.resolve.outputs.api }}
      worker: ${{ steps.resolve.outputs.worker }}
      migrate: ${{ steps.resolve.outputs.migrate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      # workflow_run has no push before/after. Merge commits also have an empty
      # `git log -n1 --name-status`, so the default "last commit" fallback
      # always reports 0 files. Compare first-parent (previous main tip) → HEAD.
      - name: Resolve paths-filter base
        id: path_base
        if: github.event_name != 'workflow_dispatch'
        run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ steps.path_base.outputs.sha }}
          ref: ${{ github.event.workflow_run.head_sha }}
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/cd.yml'
            worker:
              - 'apps/worker/**'
              - '.github/workflows/cd.yml'
            migrate:
              - 'apps/api/drizzle/**'
              - 'apps/api/src/db/**'
              - 'apps/api/drizzle.config.ts'
              - 'apps/api/scripts/db-migrate.sh'
              - 'apps/api/scripts/stamp-baseline.mjs'
              - '.github/workflows/cd.yml'
      - name: Resolve deploy flags
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "worker=true" >> "$GITHUB_OUTPUT"
            echo "migrate=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "worker=${{ steps.filter.outputs.worker }}" >> "$GITHUB_OUTPUT"
            echo "migrate=${{ steps.filter.outputs.migrate }}" >> "$GITHUB_OUTPUT"
          fi

  # DB スキーマは Drizzle（stamp + migrate）。manage.py migrate は廃止。
  db-migrate:
    name: Drizzle DB Migrate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.migrate == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install and migrate
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is required for database migrations"
            exit 1
          fi
          npm ci
          npm run db:migrate

  api-deploy:
    name: Deploy API (Cloudflare Workers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, db-migrate]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.api == 'true' &&
      (needs.db-migrate.result == 'success' || needs.db-migrate.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      # wrangler-action needs local node_modules; without npm ci it falls back to
      # installing wrangler@3.x which conflicts with @cloudflare/workers-types@5.
      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          packageManager: npm
          command: deploy --minify --env production

  worker-deploy:
    name: Deploy Worker Lambda
    runs-on: ubuntu-latest
    needs: [changes, db-migrate]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.worker == 'true' &&
      (needs.db-migrate.result == 'success' || needs.db-migrate.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push worker image (linux/arm64)
        id: build-worker
        working-directory: apps/worker
        env:
          IMAGE_URI: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY_WORKER }}:${{ github.event.workflow_run.head_sha || github.sha }}
          IMAGE_URI_LATEST: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY_WORKER }}:latest
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            -f Dockerfile \
            -t "$IMAGE_URI" \
            -t "$IMAGE_URI_LATEST" \
            --push \
            .
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Update Lambda function code
        env:
          IMAGE_URI: ${{ steps.build-worker.outputs.image_uri }}
        run: |
          aws lambda update-function-code \
            --function-name "${{ secrets.LAMBDA_WORKER_FUNCTION_NAME }}" \
            --image-uri "$IMAGE_URI"

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name "${{ secrets.LAMBDA_WORKER_FUNCTION_NAME }}"
