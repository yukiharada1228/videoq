name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      worker: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' || steps.filter.outputs.worker == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_run'
        with:
          base: HEAD~1
          filters: |
            worker:
              - 'worker-python/**'
              - '.github/workflows/cd.yml'

  # Django API Lambda deploy + manage.py migrate は廃止。
  # Web API は Cloudflare Workers（backend-hono）を別パイプラインでデプロイする。

  worker-deploy:
    name: Deploy Worker (django-free)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push worker image
        id: build-worker
        working-directory: worker-python
        env:
          IMAGE_URI: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY_WORKER }}:${{ github.event.workflow_run.head_sha || github.sha }}
          IMAGE_URI_LATEST: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY_WORKER }}:latest
        run: |
          docker build -f Dockerfile -t "$IMAGE_URI" -t "$IMAGE_URI_LATEST" .
          docker push "$IMAGE_URI"
          docker push "$IMAGE_URI_LATEST"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Update Lambda function code
        env:
          IMAGE_URI: ${{ steps.build-worker.outputs.image_uri }}
        run: |
          aws lambda update-function-code \
            --function-name "${{ secrets.LAMBDA_WORKER_FUNCTION_NAME }}" \
            --image-uri "$IMAGE_URI"

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name "${{ secrets.LAMBDA_WORKER_FUNCTION_NAME }}"
