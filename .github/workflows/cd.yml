name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      worker: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' || steps.filter.outputs.worker == 'true' }}
      migrate: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' || steps.filter.outputs.migrate == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'workflow_run'
        with:
          base: HEAD~1
          filters: |
            worker:
              - 'apps/worker/**'
              - '.github/workflows/cd.yml'
            migrate:
              - 'apps/api/drizzle/**'
              - 'apps/api/src/db/**'
              - 'apps/api/drizzle.config.ts'
              - 'apps/api/scripts/db-migrate.sh'
              - 'apps/api/scripts/stamp-baseline.mjs'
              - '.github/workflows/cd.yml'

  # Web API は Cloudflare Workers（apps/api）を別パイプラインでデプロイする。
  # DB スキーマは Drizzle（stamp + migrate）。manage.py migrate は廃止。

  db-migrate:
    name: Drizzle DB Migrate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.migrate == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install and migrate
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL secret is not set; skip migrate"
            exit 0
          fi
          npm ci
          npm run db:migrate

  worker-deploy:
    name: Deploy Worker (django-free)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push worker image
        id: build-worker
        working-directory: apps/worker
        env:
          IMAGE_URI: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY_WORKER }}:${{ github.event.workflow_run.head_sha || github.sha }}
          IMAGE_URI_LATEST: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY_WORKER }}:latest
        run: |
          docker build -f Dockerfile -t "$IMAGE_URI" -t "$IMAGE_URI_LATEST" .
          docker push "$IMAGE_URI"
          docker push "$IMAGE_URI_LATEST"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Update Lambda function code
        env:
          IMAGE_URI: ${{ steps.build-worker.outputs.image_uri }}
        run: |
          aws lambda update-function-code \
            --function-name "${{ secrets.LAMBDA_WORKER_FUNCTION_NAME }}" \
            --image-uri "$IMAGE_URI"

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name "${{ secrets.LAMBDA_WORKER_FUNCTION_NAME }}"
