name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'yukiharada1228/videoq' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      api: ${{ steps.resolve.outputs.api }}
      worker: ${{ steps.resolve.outputs.worker }}
      migrate: ${{ steps.resolve.outputs.migrate }}
    steps:
      # Read the policy from the trusted workflow revision, not the CI head SHA.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Validate production deployment source
        id: validate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const validate = require('./.github/scripts/validate-deployment.cjs');
            core.setOutput('sha', await validate({ github, context }));
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.validate.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      # Compare from the last successfully completed CD run. HEAD^1 misses
      # earlier commits in a multi-commit push and changes whose CI run was
      # cancelled by a newer push.
      - name: Resolve paths-filter base
        id: path_base
        if: github.event_name != 'workflow_dispatch'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const headSha = context.payload.workflow_run.head_sha;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cd.yml',
              branch: 'main',
              status: 'completed',
              per_page: 100,
            });
            const previous = data.workflow_runs.find(
              (run) => run.conclusion === 'success',
            );
            if (previous) {
              core.info(`Comparing ${previous.head_sha}..${headSha}`);
              core.setOutput('sha', previous.head_sha);
              return;
            }

            const root = await exec.getExecOutput(
              'git',
              ['rev-list', '--max-parents=0', headSha],
              { silent: true },
            );
            const rootSha = root.stdout.trim();
            if (!rootSha) {
              core.setFailed('Unable to resolve a paths-filter base SHA');
              return;
            }
            core.info(`No successful CD run found; comparing ${rootSha}..${headSha}`);
            core.setOutput('sha', rootSha);
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ steps.path_base.outputs.sha }}
          ref: ${{ github.event.workflow_run.head_sha }}
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/trpc/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/cd.yml'
              - '.github/scripts/**'
            worker:
              - 'apps/worker/**'
              # A migration can rename objects used by the Python worker. If a
              # coordinated deploy is blocked on migration and the follow-up
              # only fixes SQL, redeploy the worker too so production cannot
              # remain on the pre-migration schema contract.
              - 'apps/api/drizzle/**'
              - 'apps/api/src/db/**'
              - 'apps/api/drizzle.config.ts'
              - 'apps/api/scripts/db-migrate.sh'
              - 'apps/api/scripts/stamp-baseline.mjs'
              - '.github/workflows/cd.yml'
              - '.github/scripts/**'
            migrate:
              - 'apps/api/drizzle/**'
              - 'apps/api/src/db/**'
              - 'apps/api/drizzle.config.ts'
              - 'apps/api/scripts/db-migrate.sh'
              - 'apps/api/scripts/stamp-baseline.mjs'
              - '.github/workflows/cd.yml'
              - '.github/scripts/**'
      - name: Resolve deploy flags
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "worker=true" >> "$GITHUB_OUTPUT"
            echo "migrate=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "worker=${{ steps.filter.outputs.worker }}" >> "$GITHUB_OUTPUT"
            echo "migrate=${{ steps.filter.outputs.migrate }}" >> "$GITHUB_OUTPUT"
          fi

  # DB スキーマは Drizzle（stamp + migrate）。manage.py migrate は廃止。
  db-migrate:
    name: Drizzle DB Migrate
    runs-on: ubuntu-latest
    environment: production-deploy
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.migrate == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Migrate database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is required for database migrations"
            exit 1
          fi
          npm run db:migrate --workspace @videoq/api

  api-deploy:
    name: Deploy API (Cloudflare Workers)
    runs-on: ubuntu-latest
    environment: production-deploy
    timeout-minutes: 15
    needs: [changes, db-migrate]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.api == 'true' &&
      (needs.db-migrate.result == 'success' || needs.db-migrate.result == 'skipped')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install API dependencies
        run: npm ci
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Cloudflare deployment credentials are required"
            exit 1
          fi
          npm run deploy --workspace @videoq/api

  worker-deploy:
    name: Deploy Worker Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    needs: [changes, db-migrate]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.worker == 'true' &&
      (needs.db-migrate.result == 'success' || needs.db-migrate.result == 'skipped')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.changes.outputs.sha }}
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_DEPLOY_ROLE_ARN }}
          role-session-name: videoq-worker-deploy
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push worker image (linux/arm64)
        id: build-worker
        working-directory: apps/worker
        env:
          IMAGE_URI: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY_WORKER }}:${{ needs.changes.outputs.sha }}
          IMAGE_URI_LATEST: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY_WORKER }}:latest
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            -f Dockerfile \
            -t "$IMAGE_URI" \
            -t "$IMAGE_URI_LATEST" \
            --push \
            .
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Update Lambda function code
        env:
          IMAGE_URI: ${{ steps.build-worker.outputs.image_uri }}
        run: |
          aws lambda update-function-code \
            --function-name "${{ secrets.LAMBDA_WORKER_FUNCTION_NAME }}" \
            --image-uri "$IMAGE_URI"

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name "${{ secrets.LAMBDA_WORKER_FUNCTION_NAME }}"
