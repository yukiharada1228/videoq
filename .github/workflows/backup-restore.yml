name: Backup Restore Test
on:
  schedule:
    - cron: '41 4 1 * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backup-restore
  cancel-in-progress: false
jobs:
  restore:
    if: github.repository == 'yukiharada1228/videoq' && github.ref == 'refs/heads/main'
    environment: production-app
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install separately locked operations tools without lifecycle scripts
        run: npm ci --ignore-scripts --prefix .github/operations-tools
      - name: Verify operations tool registry signatures
        working-directory: .github/operations-tools
        run: npm audit signatures
      - name: Back up a read-only snapshot and restore into an ephemeral database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node .github/scripts/backup-restore.mjs
      - name: Publish or resolve the managed issue
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const { notify } = require('./.github/scripts/operations-notify.cjs');
            let report = { status: 'error', summary: '本番の定期検査を完了できませんでした。', details: [] };
            if (fs.existsSync('operations-report.json')) report = JSON.parse(fs.readFileSync('operations-report.json', 'utf8'));
            await notify({ github, context, core, kind: 'backup-restore', title: 'バックアップの復元テスト', report });
            if (report.status !== 'ok') core.setFailed(report.summary);
