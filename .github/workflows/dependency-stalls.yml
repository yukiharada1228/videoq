name: Dependency Stalls
on:
  schedule:
    - cron: '43 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-stalls
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'videoq-jp/videoq' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { inspect } = require('./.github/scripts/dependency-stalls.cjs');
            const { notify } = require('./.github/scripts/operations-notify.cjs');
            let report;
            try { report = await inspect({ github, context }); }
            catch { report = { status: 'error', summary: '依存関係PRの滞留検査を完了できませんでした。', details: [] }; }
            await notify({ github, context, core, kind: 'dependency-stalls', title: '依存関係PRの滞留', report });
            if (report.status === 'error') core.setFailed(report.summary);
