name: Terraform Drift
on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: terraform-drift
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'yukiharada1228/videoq' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_PLAN_ROLE_ARN }}
          role-session-name: videoq-drift-readonly
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Initialize with the reviewed lockfile
        working-directory: infra
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: terraform init -lockfile=readonly -input=false -backend-config="bucket=$TF_STATE_BUCKET" > /dev/null 2>&1
      - name: Read-only plan with the backend mutex and no attribute output
        working-directory: infra
        env:
          OPENAI_ADMIN_KEY: ${{ secrets.OPENAI_ADMIN_KEY }}
          TF_VAR_openai_spend_alert_email: ${{ secrets.OPENAI_SPEND_ALERT_EMAIL }}
          TF_VAR_operations_alert_email: ${{ secrets.OPERATIONS_ALERT_EMAIL }}
        run: python ../.github/scripts/terraform-drift.py
      - name: Publish or resolve the managed issue
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const { notify } = require('./.github/scripts/operations-notify.cjs');
            let report = { status: 'error', summary: '定期検査を完了できませんでした。', details: [] };
            if (fs.existsSync('operations-report.json')) report = JSON.parse(fs.readFileSync('operations-report.json', 'utf8'));
            await notify({ github, context, core, kind: 'terraform-drift', title: 'Terraformの差分', report });
            if (report.status !== 'ok') core.setFailed(report.summary);
