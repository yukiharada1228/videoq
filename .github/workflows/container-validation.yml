name: Container Validation

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: container-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  queue:
    name: Queue Admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      run: ${{ steps.admission.outputs.run }}
    steps:
      # Read trusted main policy; this job never installs or executes PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: admission
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          QUEUE_ENABLED: ${{ vars.DEPENDENCY_QUEUE_ENABLED }}
          QUEUE_ISSUE: ${{ vars.DEPENDENCY_QUEUE_ISSUE }}
        with:
          script: |
            if (process.env.QUEUE_ENABLED !== 'true') { core.setOutput('run', true); return; }
            const run = await require('./.github/scripts/dependency-queue.cjs').admission({
              github, context, issue: Number(process.env.QUEUE_ISSUE), enabled: true,
            });
            core.setOutput('run', run);
            await core.summary.addRaw(run ? 'CI admitted.' : 'Waiting for the dependency queue. Heavy jobs are deferred.').write();
      - name: Queue slot admitted
        if: steps.admission.outputs.run == 'true'
        run: echo 'Normal CI is authorized for this PR and main snapshot.'

  changes:
    needs: queue
    if: needs.queue.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      containers: ${{ steps.filter.outputs.containers }}
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            containers:
              - 'apps/api/Dockerfile*'
              - 'apps/web/Dockerfile*'
              - 'apps/worker/Dockerfile*'
              - 'docker-compose.yml'
              - '.github/workflows/container-validation.yml'
              - '.github/runtime-versions.json'
              - '.node-version'
              - '.python-version'
              - '.github/actions/**'
              - '.github/scripts/runtime-*'
              - '.github/scripts/package-managers.py'
            worker:
              - 'apps/worker/**'
              - '.github/runtime-versions.json'
              - '.python-version'
              - '.github/scripts/runtime-*'
              - '.github/scripts/package-managers.py'
              - '.github/workflows/container-validation.yml'

  validate:
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env.example config --quiet
      - name: Check Dockerfile instructions and base images
        run: |
          docker build --check -f apps/api/Dockerfile.local .
          docker build --check -f apps/api/Dockerfile .
          docker build --check -f apps/web/Dockerfile .
          docker build --check -f apps/web/Dockerfile.dev .
          docker build --check --platform linux/arm64 -f apps/worker/Dockerfile apps/worker
          docker build --check -f apps/worker/Dockerfile.local apps/worker
          docker build --check -f apps/worker/Dockerfile.onprem apps/worker

  node-runtime:
    name: Node container (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile.local
            target: ''
          - name: web
            dockerfile: apps/web/Dockerfile
            target: build
          - name: web-dev
            dockerfile: apps/web/Dockerfile.dev
            target: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the actual application image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          TARGET: ${{ matrix.target }}
        run: |
          args=()
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          docker build --pull "${args[@]}" -t videoq-node-runtime -f "$DOCKERFILE" .
      - name: Require the reviewed Node and npm versions inside the image
        run: |
          test "$(docker run --rm --entrypoint node videoq-node-runtime -p process.versions.node)" = "$(cat .node-version)"
          expected=$(python3 -c 'import json; print(json.load(open(".github/runtime-versions.json"))["npm"])')
          test "$(docker run --rm --entrypoint npm videoq-node-runtime --version)" = "$expected"
      - name: Test application types and native Worker runtime
        if: matrix.name == 'api'
        run: |
          docker run --rm --entrypoint npm videoq-node-runtime run typecheck
          docker run --rm --entrypoint npm videoq-node-runtime run test:workers

  worker-image:
    name: Worker image security (ARM64)
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No AWS credentials or production secrets are available while building
      # and scanning PR code. The Dockerfile also validates runtime imports.
      - name: Build the production target
        run: docker build --platform linux/arm64 --target production -t videoq-worker:ci apps/worker
      - name: Require no HIGH or CRITICAL vulnerabilities in the production filesystem
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # v0.35.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: videoq-worker:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          timeout: 15m

  result:
    name: Container Validation
    needs: [queue, changes, validate, node-runtime, worker-image]
    if: always() && needs.queue.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CONTAINERS_CHANGED: ${{ needs.changes.outputs.containers }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          NODE_RESULT: ${{ needs.node-runtime.result }}
          WORKER_CHANGED: ${{ needs.changes.outputs.worker }}
          WORKER_RESULT: ${{ needs.worker-image.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$CONTAINERS_CHANGED" = true ]; then
            test "$VALIDATE_RESULT" = success
            test "$NODE_RESULT" = success
          fi
          if [ "$WORKER_CHANGED" = true ]; then
            test "$WORKER_RESULT" = success
          fi
