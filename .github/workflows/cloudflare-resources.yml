name: Sync Cloudflare Resources

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-resources-production
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Hyperdrive and R2 settings
    runs-on: ubuntu-latest
    if: github.repository == 'yukiharada1228/videoq' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install API dependencies
        run: npm ci
      - name: Verify production Worker secrets
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required"
            exit 1
          fi
          secret_json="$(npx wrangler secret list --env production --format json)"
          for secret_name in \
            BETTER_AUTH_SECRET \
            USER_SECRET_ENCRYPTION_KEY \
            OPENAI_API_KEY \
            MAILGUN_API_KEY \
            R2_ACCESS_KEY_ID \
            R2_SECRET_ACCESS_KEY \
            SQS_QUEUE_URL \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            STRIPE_SECRET_KEY \
            STRIPE_WEBHOOK_SECRET
          do
            if ! jq -e --arg name "$secret_name" 'any(.[]; .name == $name)' <<<"$secret_json" >/dev/null; then
              echo "::error::Missing production Worker secret: $secret_name"
              exit 1
            fi
          done
      - name: Apply and verify production resource settings
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_INFRA_TOKEN and CLOUDFLARE_ACCOUNT_ID are required"
            exit 1
          fi
          npm run cf:hyperdrive:disable-cache
          npm run cf:r2-cors:apply
          npm run cf:hyperdrive:show
          npm run cf:r2-cors:list
