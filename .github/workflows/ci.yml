name: CI
on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      hono: ${{ steps.filter.outputs.hono }}
      worker: ${{ steps.filter.outputs.worker }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            hono:
              - 'apps/api/**'
              - 'packages/trpc/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            worker:
              - 'apps/worker/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'apps/web/**'
              - 'packages/trpc/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            docs:
              - 'apps/docs/**'
              - 'docs/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  hono-test:
    name: Hono (apps/api)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.hono == 'true'
    env:
      QUOTA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install / typecheck / test
        run: |
          npm ci
          npm run cf-typegen:check --workspace @videoq/api
          npm run typecheck --workspace @videoq/trpc
          npm run typecheck --workspace @videoq/api
          npm run db:check --workspace @videoq/api
          npm run db:verify --workspace @videoq/api
          npm test --workspace @videoq/api

  worker-test:
    name: Worker Python (django-free)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        working-directory: apps/worker
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install -e . pytest
          pip install pytest
          python -m pytest tests/ -q

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run lint --workspace @videoq/web
      - name: Type check
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run typecheck --workspace @videoq/web

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests with coverage
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run test:coverage --workspace @videoq/web
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./apps/web/coverage/lcov.info,./apps/web/coverage/coverage-final.json
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          directory: ./apps/web

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build --workspace @videoq/web
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: apps/web/dist
          retention-days: 7

  frontend-storybook:
    name: Frontend Storybook
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Storybook
        run: npm run build:storybook
      - name: Install Chromium
        run: npm exec --workspace @videoq/web -- playwright install --with-deps chromium
      - name: Test stories in Chromium
        run: npm run test:storybook
      - name: Upload Storybook
        uses: actions/upload-artifact@v4
        with:
          name: frontend-storybook
          path: apps/web/storybook-static
          retention-days: 7

  docs-build:
    name: Documentation Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --workspace @videoq/docs
      - name: Type check
        run: npm run typecheck --workspace @videoq/docs
      - name: Build documentation and check links
        run: npm run build:docs
      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation-build
          path: apps/docs/build
          retention-days: 7

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - changes
      - hono-test
      - worker-test
      - frontend-lint
      - frontend-test
      - frontend-build
      - frontend-storybook
      - docs-build
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.hono-test.result }}" == "failure" ]] || \
             [[ "${{ needs.docs-build.result }}" == "failure" ]] || \
             [[ "${{ needs.docs-build.result }}" == "cancelled" ]] || \
             [[ "${{ needs.worker-test.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-lint.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-test.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-build.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-storybook.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-storybook.result }}" == "cancelled" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs succeeded or were skipped"
