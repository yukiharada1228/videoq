name: Cloudflare Token Expiry

on:
  schedule:
    # Daily at 09:17 JST; avoid the busy start of the hour.
    - cron: '17 0 * * *'
  push:
    branches: [main]
    paths:
      - '.github/cloudflare-token-expiry.json'
      - '.github/scripts/cloudflare-token-expiry*'
      - '.github/workflows/cloudflare-token-expiry.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview notifications without creating or changing issues
        type: boolean
        default: false
      preview_date:
        description: 'Optional UTC date for dry-run only (YYYY-MM-DD)'
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-token-expiry
  cancel-in-progress: false

jobs:
  check:
    name: Check Cloudflare token expiry
    if: github.repository == 'yukiharada1228/videoq' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Check dates and notify the maintainer
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          PREVIEW_DATE: ${{ inputs.preview_date }}
        with:
          script: |
            const check = require('./.github/scripts/cloudflare-token-expiry.cjs');
            const config = require('./.github/cloudflare-token-expiry.json');
            await check({ github, context, core, config,
              dryRun: process.env.DRY_RUN === 'true',
              previewDate: process.env.PREVIEW_DATE,
            });
