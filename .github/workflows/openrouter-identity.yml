name: OpenRouter Workload Identity Setup

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect account issuer, enable outbound federation, or probe the CI identity
        type: choice
        options: [inspect, enable, probe]
        default: inspect

permissions:
  contents: read

concurrency:
  group: openrouter-identity-setup
  cancel-in-progress: false

jobs:
  identity:
    if: github.repository == 'videoq-jp/videoq' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-infra
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: infra/scripts
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install AWS SDK
        run: python -m pip install --disable-pip-version-check 'boto3==1.43.122'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_DEPLOY_ROLE_ARN }}
          role-session-name: videoq-openrouter-identity-setup
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Inspect or prepare the AWS issuer
        env:
          OPERATION: ${{ inputs.operation }}
          FEDERATION_AUDIENCE: ${{ vars.OPENROUTER_FEDERATION_AUDIENCE || 'https://openrouter.ai' }}
        run: |
          args=()
          case "$OPERATION" in
            inspect) ;;
            enable) args+=(--enable) ;;
            probe) args+=(--probe) ;;
            *) echo 'Unknown operation'; exit 1 ;;
          esac
          python infra/scripts/openrouter_identity.py --audience "$FEDERATION_AUDIENCE" "${args[@]}"
