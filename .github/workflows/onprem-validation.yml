name: On-prem Validation
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '43 1 * * *'
permissions:
  contents: read
jobs:
  onprem:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      QUOTA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      ONPREM_SMOKE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - run: npm ci --ignore-scripts --workspace @videoq/api
      - name: Install pinned Helm
        run: HELM_INSTALL_DIR="$RUNNER_TEMP/helm" bash .github/scripts/install-helm.sh
      - name: Validate runtime, shared state and chart variants
        run: |
          npm run typecheck --workspace @videoq/api
          npm run build:node --workspace @videoq/api
          npm run db:migrate --workspace @videoq/api
          HELM_BIN="$RUNNER_TEMP/helm/helm" npm run test:unit --workspace @videoq/api -- test/node-runtime.test.ts test/node-runtime.integration.test.ts test/node-storage.test.ts test/helm-chart.test.ts test/inference-chart.test.ts test/local-chat-model.test.ts
          "$RUNNER_TEMP/helm/helm" lint charts/videoq --strict -f charts/videoq/examples/site.yaml
          "$RUNNER_TEMP/helm/helm" lint charts/videoq-inference --strict
          "$RUNNER_TEMP/helm/helm" lint charts/videoq-inference --strict -f charts/videoq-inference/examples/nvidia.yaml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: apps/inference/whisper/.python-version
      - name: Install checksum-pinned uv
        run: bash .github/scripts/install-uv.sh
      - name: Validate the private Whisper API with locked dependencies
        working-directory: apps/inference/whisper
        run: |
          uv sync --locked
          uv run --locked pytest -q
          docker build -t videoq-local-whisper:onprem-ci .
          docker run --rm --entrypoint python videoq-local-whisper:onprem-ci -c 'import server; import faster_whisper; assert server.MODEL_ALIAS == "whisper-local"'
      - name: Build production on-prem images
        id: images
        run: |
          docker build -t videoq-api:onprem-ci -f apps/api/Dockerfile .
          docker build -t videoq-worker:onprem-ci -f apps/worker/Dockerfile.onprem apps/worker
          docker build -t videoq-web:onprem-ci -f apps/web/Dockerfile .
      - name: Exercise production API image over HTTP
        working-directory: apps/api
        run: node scripts/smoke-node.mjs videoq-api:onprem-ci
      - name: Exercise migration command and worker imports in production images
        run: |
          docker run --rm --network host --env DATABASE_URL videoq-api:onprem-ci sh scripts/db-migrate.sh
          docker run --rm --entrypoint python videoq-worker:onprem-ci -c 'import worker_python.lambda_handler; import runpy; runpy.run_path("scripts/run_worker.py", run_name="import_check")'
      - name: Scan the API image including unfixed vulnerabilities
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # v0.35.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: videoq-api:onprem-ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          timeout: 10m
      - name: Scan the worker image including unfixed vulnerabilities
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # v0.35.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: videoq-worker:onprem-ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          timeout: 10m
      - name: Scan the web image including unfixed vulnerabilities
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # v0.35.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: videoq-web:onprem-ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          timeout: 10m
      - name: Scan the local Whisper image including unfixed vulnerabilities
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # v0.35.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: videoq-local-whisper:onprem-ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          timeout: 10m
      - name: Resolve the pinned local Ollama image
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { parse } from 'yaml';
          const image = parse(readFileSync('charts/videoq-inference/values.yaml', 'utf8')).ollama.image;
          const reference = `${image.repository}@${image.digest}`;
          if (!/^[a-z0-9./_-]+@sha256:[a-f0-9]{64}$/.test(reference)) throw new Error('An exact Ollama image digest is required');
          appendFileSync(process.env.GITHUB_ENV, `OLLAMA_IMAGE=${reference}\n`);
          JS
      - name: Scan the local Ollama image including unfixed vulnerabilities
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # v0.35.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: ${{ env.OLLAMA_IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          timeout: 10m
      - name: Record package inventories for incident response
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        run: |
          mkdir -p sbom
          for component in api worker web local-whisper; do
            trivy image --image-src docker --format cyclonedx --output "sbom/${component}.cdx.json" "videoq-${component}:onprem-ci"
          done
          trivy image --format cyclonedx --output sbom/ollama.cdx.json "$OLLAMA_IMAGE"
      - name: Retain the image inventories
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onprem-sbom-${{ github.sha }}
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Install checksum-pinned kind
        run: KIND_INSTALL_DIR="$RUNNER_TEMP" bash .github/scripts/install-kind.sh
      - name: Exercise Kubernetes install, processing, restore, upgrade and rollback
        env:
          HELM_BIN: ${{ runner.temp }}/helm/helm
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          kind create cluster --name videoq-onprem-lab --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --kubeconfig "$RUNNER_TEMP/lab-kubeconfig" --wait 180s
          python3 .github/scripts/onprem-lab.py "$RUNNER_TEMP/lab-kubeconfig" "$RUNNER_TEMP/lab-result"
      - name: Retain Kubernetes validation evidence
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onprem-lab-${{ github.sha }}
          path: ${{ runner.temp }}/lab-result/result.json
          if-no-files-found: warn
          retention-days: 30
      - name: Remove the disposable Kubernetes cluster
        if: always()
        run: |
          if [ -x "$RUNNER_TEMP/kind" ]; then
            "$RUNNER_TEMP/kind" delete cluster --name videoq-onprem-lab --kubeconfig "$RUNNER_TEMP/lab-kubeconfig"
          fi
