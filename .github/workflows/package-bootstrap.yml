name: Package Namespace Bootstrap
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful On-prem Release run to verify and copy
        type: string
        required: true
      publish:
        description: Create bootstrap tags in the four new packages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: package-namespace-bootstrap
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.repository == 'yukiharada1228/videoq' && github.ref == 'refs/heads/main' && github.sha == github.workflow_sha
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      attestations: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      BOOTSTRAP_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Validate the source release run
        id: source
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: python3 .github/scripts/package-bootstrap.py source-run "$RELEASE_RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download the exact signed release bundle
        env:
          SOURCE_RUN: ${{ steps.source.outputs.run_id }}
          ARTIFACT: ${{ steps.source.outputs.artifact }}
        run: gh run download "$SOURCE_RUN" --repo yukiharada1228/videoq --name "$ARTIFACT" --dir release
      - name: Verify signatures and preview all four copy targets
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: python3 .github/scripts/package-bootstrap.py bootstrap "$SOURCE_SHA" release bootstrap-report.json
      - name: Authenticate the repository token to GHCR
        if: inputs.publish
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/package-bootstrap-docker
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Copy verified manifests without building or executing images
        if: inputs.publish
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/package-bootstrap-docker
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: python3 .github/scripts/package-bootstrap.py bootstrap "$SOURCE_SHA" release bootstrap-report.json --publish
      - name: Retain source digests, copy results and package settings links
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: bootstrap-report.json
          retention-days: 30
          if-no-files-found: warn
      - name: Remove registry credentials from the disposable runner
        if: ${{ always() && inputs.publish }}
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/package-bootstrap-docker
        run: docker logout ghcr.io
