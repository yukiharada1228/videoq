name: Dependency Main Sync
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: dependency-main-sync
  cancel-in-progress: false
jobs:
  select:
    if: >-
      github.repository == 'yukiharada1228/videoq' && github.ref == 'refs/heads/main' &&
      vars.DEPENDENCY_AUTOMERGE_ENABLED == 'true' && vars.DEPENDENCY_REBASE_ENABLED != 'false' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      number: ${{ steps.select.outputs.number }}
      sha: ${{ steps.select.outputs.sha }}
      ecosystem: ${{ steps.select.outputs.ecosystem }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: select
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const c = await require('./.github/scripts/dependency-rebase.cjs').select({ github, context });
            if (c) for (const key of ['number', 'sha', 'ecosystem']) core.setOutput(key, c[key]);
            else await core.summary.addRaw('No verified dependency PR waiting for main sync.').write();
  update:
    needs: select
    if: needs.select.outputs.number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dependency-automation-${{ needs.select.outputs.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          app-id: ${{ vars.PATCH_BOT_APP_ID }}
          private-key: ${{ secrets.PATCH_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-administration: read
          permission-workflows: ${{ needs.select.outputs.ecosystem == 'github_actions' && 'write' || '' }}
      - name: Rebase without changing the verified dependency update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.select.outputs.number }}
          EXPECTED_SHA: ${{ needs.select.outputs.sha }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
        with:
          script: |
            const c = await require('./.github/scripts/dependency-rebase.cjs').update({
              github, writerGithub: new github.constructor({ auth: process.env.APP_TOKEN }), context,
              number: Number(process.env.PR_NUMBER), expectedSha: process.env.EXPECTED_SHA,
            });
            await core.summary.addRaw(c ? `Rebased #${c.number}; normal CI must pass for ${c.sha}.` : 'PR changed or no longer eligible.').write();
      - name: Stop queued merge if main sync failed
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.select.outputs.number }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
        with:
          script: |
            const app = new github.constructor({ auth: process.env.APP_TOKEN });
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: Number(process.env.PR_NUMBER) });
            if (pr.auto_merge) await app.graphql('mutation($id:ID!){disablePullRequestAutoMerge(input:{pullRequestId:$id}){clientMutationId}}', { id: pr.node_id });
            await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number,
              body: `mainへの自動追従を完了できなかったため、自動マージを停止しました。確認が必要です: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
