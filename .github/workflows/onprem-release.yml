name: On-prem Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: onprem-release
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'yukiharada1228/videoq' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const validate = require('./.github/scripts/validate-deployment.cjs');
            core.setOutput('sha', await validate({ github, context }));
  build:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        component: [api, worker, web]
        include:
          - component: api
            dockerfile: apps/api/Dockerfile
            context: .
          - component: worker
            dockerfile: apps/worker/Dockerfile.onprem
            context: apps/worker
          - component: web
            dockerfile: apps/web/Dockerfile
            context: .
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build without publishing credentials
        env:
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.arch }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_CONTEXT: ${{ matrix.context }}
        run: docker build --platform "linux/$ARCH" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "videoq-$COMPONENT:release" -f "$DOCKERFILE" "$BUILD_CONTEXT"
      - name: Block vulnerable images, including unfixed HIGH and CRITICAL findings
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # v0.35.0
        with:
          version: v0.76.1
          image-ref: videoq-${{ matrix.component }}:release
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          timeout: 10m
      - name: Prepare immutable image archive and SBOM
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          mkdir -p artifact
          trivy image --image-src docker --format cyclonedx --output artifact/sbom.cdx.json "videoq-$COMPONENT:release"
          docker save "videoq-$COMPONENT:release" | zstd -T0 -o artifact/image.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.component }}-${{ matrix.arch }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: artifact
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  chart:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: HELM_INSTALL_DIR="$RUNNER_TEMP/helm" bash .github/scripts/install-helm.sh
      - run: |
          mkdir -p release
          "$RUNNER_TEMP/helm/helm" package charts/videoq --version "0.1.0-sha.$GITHUB_SHA" --app-version "$GITHUB_SHA" --destination release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [source, build]
    strategy:
      fail-fast: false
      matrix:
        component: [api, worker, web]
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # Fresh runner: never build or execute the application's code here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ matrix.component }}-${{ matrix.arch }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
      - name: Load and publish the scanned image without executing it
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.arch }}
        run: |
          zstd -d image.tar.zst --stdout | docker load
          python3 .github/scripts/onprem_registry.py "$COMPONENT" --allow-missing
          repository="ghcr.io/yukiharada1228/videoq-onprem-$COMPONENT"
          tag="$repository:$GITHUB_SHA-$ARCH-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "videoq-$COMPONENT:release" "$tag"
          docker push "$tag"
          python3 .github/scripts/onprem_registry.py "$COMPONENT"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$tag")
          digest="${digest##*@}"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          mkdir -p published
          printf '%s\n' "$digest" > "published/$COMPONENT-$ARCH.digest"
      - name: Sign image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Sign image package inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-${{ matrix.component }}-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: published/*.digest
          if-no-files-found: error
          retention-days: 1
  indexes:
    needs: [source, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        component: [api, worker, web]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: published-${{ matrix.component }}-*-attempt-${{ github.run_attempt }}
          merge-multiple: true
      - id: image
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ matrix.component }}
        run: |
          python3 .github/scripts/onprem_registry.py "$COMPONENT"
          repository="ghcr.io/yukiharada1228/videoq-onprem-$COMPONENT"
          tag="$repository:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --tag "$tag" "$repository@$(cat "$COMPONENT-amd64.digest")" "$repository@$(cat "$COMPONENT-arm64.digest")"
          digest=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
          mkdir -p release
          printf '%s\n' "$digest" > "release/$COMPONENT.digest"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: index-${{ matrix.component }}-attempt-${{ github.run_attempt }}
          path: release/*.digest
          if-no-files-found: error
          retention-days: 1
  release:
    needs: [source, indexes, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: index-*-attempt-${{ github.run_attempt }}
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: release
      - run: python3 .github/scripts/onprem-release.py assemble "$GITHUB_SHA" release
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/release.json
            release/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onprem-release-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            release/release.json
            release/*.tgz
          if-no-files-found: error
          retention-days: 90
  staging:
    name: Verify signed artifacts and rehearse the release
    needs: [source, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: onprem-release-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: release
      - name: Verify provenance before loading release images
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/registry-read
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for component in api worker web; do
            python3 .github/scripts/onprem_registry.py "$component"
          done
          python3 .github/scripts/onprem-release.py verify "$GITHUB_SHA" release/release.json release/verified-images.json
          python3 - <<'PY'
          import json, subprocess
          images = json.load(open('release/verified-images.json'))
          for component in ['api', 'worker', 'web']:
              image = images[component]['image']
              reference = image['repository'] + '@' + image['digest']
              subprocess.run(['docker', 'pull', reference], check=True)
              subprocess.run(['docker', 'tag', reference, 'videoq-' + component + ':onprem-ci'], check=True)
          PY
          docker logout ghcr.io
          rm -rf "$DOCKER_CONFIG"
      - name: Install pinned rehearsal tools
        run: |
          HELM_INSTALL_DIR="$RUNNER_TEMP/helm" bash .github/scripts/install-helm.sh
          KIND_INSTALL_DIR="$RUNNER_TEMP" bash .github/scripts/install-kind.sh
      - name: Rehearse the verified release in disposable Kubernetes
        env:
          HELM_BIN: ${{ runner.temp }}/helm/helm
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          kind create cluster --name videoq-onprem-lab --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --kubeconfig "$RUNNER_TEMP/lab-kubeconfig" --wait 180s
          python3 .github/scripts/onprem-lab.py "$RUNNER_TEMP/lab-kubeconfig" "$RUNNER_TEMP/lab-result" --chart "release/videoq-0.1.0-sha.$GITHUB_SHA.tgz"
      - name: Record staging evidence for promotion review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onprem-staging-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            release/verified-images.json
            ${{ runner.temp }}/lab-result/result.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove registry credentials and disposable cluster
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/registry-read"
          if [ -x "$RUNNER_TEMP/kind" ]; then
            "$RUNNER_TEMP/kind" delete cluster --name videoq-onprem-lab --kubeconfig "$RUNNER_TEMP/lab-kubeconfig"
          fi
