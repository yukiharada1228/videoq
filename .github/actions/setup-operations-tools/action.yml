name: Set up operations tools
description: Install the isolated operations lockfile and verify registry signatures.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
    - uses: ./.github/actions/setup-package-manager
      with:
        manager: npm
    - shell: bash
      run: npm ci --ignore-scripts --prefix .github/operations-tools
    - shell: bash
      working-directory: .github/operations-tools
      run: npm audit signatures
