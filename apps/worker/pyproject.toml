[project]
name = "videoq-worker"
version = "0.2.0"
description = "SQS task worker for VideoQ Lambda"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "openai>=1.40",
    "boto3>=1.34",
    # Security floor for boto3/requests, also enforced by the Lambda pip build.
    "urllib3>=2.8.0,<3",
    "cryptography>=42.0",
    "numpy>=1.26",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Verify that Python writes remain compatible with both search clients.
    "langchain-postgres==0.0.18",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["worker_python*"]

[tool.pytest.ini_options]
pythonpath = ["."]
