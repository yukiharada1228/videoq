[project]
name = "videoq-worker"
version = "0.2.0"
description = "SQS task worker for VideoQ Lambda"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "openai>=1.40",
    "boto3>=1.34",
    # Security floor for boto3/requests, also enforced by the Lambda pip build.
    "urllib3>=2.8.0,<3",
    "cryptography>=42.0",
    "numpy>=1.26",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Exercise the deployed Modal ASGI boundary in worker CI.
    "modal==1.6.2",
    "fastapi==0.146.0",
    # Reject the Starlette versions covered by the open security advisories.
    "starlette>=1.3.1",
    "python-multipart==0.0.32",
    "httpx>=0.27",
    # Verify that Python writes remain compatible with both search clients.
    "langchain-postgres==0.0.19",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["worker_python*"]

[tool.pytest.ini_options]
pythonpath = ["."]
