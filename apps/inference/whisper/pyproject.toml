[project]
name = "videoq-local-whisper"
version = "0.1.0"
description = "Private, offline-at-runtime Whisper transcription endpoint for VideoQ"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper==1.2.1",
    # PyAV 19 removed metadata_errors, which faster-whisper 1.2.1 uses.
    "av==18.1.0",
    "fastapi==0.146.0",
    "starlette>=1.3.1",
    "python-multipart==0.0.32",
    "uvicorn>=0.38,<1",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "openai>=1.40"]

[tool.pytest.ini_options]
pythonpath = ["."]
